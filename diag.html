<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RetroLeaks — diagnostics</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  body {
    margin: 0; padding: 18px;
    background: #1c1c1e; color: #e8e6e1;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  h1 { font-size: 15px; letter-spacing: .18em; text-transform: uppercase; margin: 0 0 4px; }
  .sub { color: #8e8e95; font-size: 12.5px; margin: 0 0 20px; }
  button {
    display: block; width: 100%; padding: 13px; margin: 0 0 10px;
    border: none; border-radius: 11px; background: #e8e6e1; color: #1a1a1c;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button.alt { background: transparent; border: 1px solid #3a3a40; color: #e8e6e1; }
  input[type=file] { margin: 0 0 14px; color: #8e8e95; font-size: 13px; }
  pre {
    background: #232326; border: 1px solid #3a3a40; border-radius: 11px;
    padding: 13px; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word; margin: 0 0 16px;
  }
  .ok { color: #9ecb9e; } .bad { color: #e8a87c; } .note { color: #8e8e95; }
  img#out { max-width: 100%; border-radius: 9px; display: none; margin-bottom: 16px; }
</style>
</head>
<body>

<h1>Diagnostics</h1>
<p class="sub">This page uses no service worker, so it always runs fresh.</p>

<pre id="log">Starting…</pre>

<button id="clearBtn" class="alt">Clear cache and service worker</button>

<p class="sub">Pick an image below and I will walk the whole pipeline, step by step:</p>
<input type="file" id="file" accept="image/*">
<img id="out" alt="Test result">

<button id="copyBtn" class="alt">Copy log</button>

<script>
const logEl = document.getElementById('log');
let lines = [];

function say(text, cls) {
  lines.push(text);
  const span = cls ? `<span class="${cls}">${text}</span>` : text;
  logEl.innerHTML = lines.map((l, i) => (i === lines.length - 1 ? span : l)).join('\n');
  logEl.innerHTML = lines.join('\n');
}
function ok(t)   { lines.push('OK    ' + t); render(); }
function bad(t)  { lines.push('FAIL  ' + t); render(); }
function info(t) { lines.push('      ' + t); render(); }
function head(t) { lines.push('', '── ' + t + ' ' + '─'.repeat(Math.max(0, 34 - t.length))); render(); }

function render() {
  logEl.innerHTML = lines.map((l) => {
    if (l.startsWith('OK')) return '<span class="ok">' + l + '</span>';
    if (l.startsWith('FAIL')) return '<span class="bad">' + l + '</span>';
    if (l.startsWith('──')) return '<span class="note">' + l + '</span>';
    return '<span class="note">' + l + '</span>';
  }).join('\n');
}

/* ── 1. Environment ───────────────────────────────── */
async function checkEnvironment() {
  head('Environment');
  info('address: ' + location.href);
  info('secure context: ' + (window.isSecureContext ? 'yes' : 'NO'));
  info('browser: ' + navigator.userAgent.slice(0, 110));
  info('launched from home screen: ' + (navigator.standalone || matchMedia('(display-mode: standalone)').matches ? 'yes' : 'no'));

  const canShareFiles = (() => {
    try {
      const probe = new File([new Blob(['x'])], 'a.jpg', { type: 'image/jpeg' });
      return Boolean(navigator.canShare && navigator.canShare({ files: [probe] }));
    } catch (e) { return false; }
  })();
  info('can share files: ' + (canShareFiles ? 'yes' : 'no — saving to Photos needs Safari on iPhone'));
}

/* ── 2. Service worker and cache ───────────── */
async function checkServiceWorker() {
  head('Service worker');
  if (!('serviceWorker' in navigator)) { info('not supported'); return; }

  const regs = await navigator.serviceWorker.getRegistrations();
  info('registrations: ' + regs.length);
  regs.forEach((r) => info('  scope: ' + r.scope));

  const names = await caches.keys();
  info('caches: ' + (names.length ? names.join(', ') : 'none'));

  for (const name of names) {
    const cache = await caches.open(name);
    const keys = await cache.keys();
    info('  ' + name + ': ' + keys.length + ' entries');
    const hasLeak = keys.some((k) => k.url.includes('/leaks/L'));
    if (name.includes('v1')) {
      bad('  An OLD (v1) cache is live and will serve stale code. Clear it with the button.');
    }
    info('  leak image in cache: ' + (hasLeak ? 'yes' : 'no'));
  }
}

/* ── 3. File availability ─────────────────────── */
async function checkFiles() {
  head('Files on the server');
  const targets = ['app.js', 'index.html', 'leaks/params.json', 'leaks/L0.jpg', 'leaks/L45.jpg', 'icons/icon-192.png'];

  for (const path of targets) {
    try {
      // cache: 'reload' bypasses the HTTP cache, though not the service worker
      const response = await fetch(path, { cache: 'reload' });
      const size = (await response.blob()).size;
      if (response.ok) ok(path + ' — ' + response.status + ', ' + size + ' bytes');
      else bad(path + ' — ' + response.status);
    } catch (error) {
      bad(path + ' — ' + error.message);
    }
  }

  head('Which app.js is actually running?');
  try {
    const text = await (await fetch('app.js', { cache: 'reload' })).text();
    info('size: ' + text.length + ' characters');
    info('built-in leak list: ' + (text.includes('BUILTIN_LEAKS') ? 'present (new)' : 'missing (OLD)'));
    info('startup self-check: ' + (text.includes('Startup check') ? 'present (new)' : 'missing (OLD)'));
  } catch (error) {
    bad('app.js unreadable: ' + error.message);
  }
}

/* ── 4. Canvas capability ───────────────────────── */
async function checkCanvas() {
  head('Canvas');
  try {
    const canvas = document.createElement('canvas');
    canvas.width = 800; canvas.height = 600;
    const ctx = canvas.getContext('2d');
    if (!ctx) { bad('no 2d context'); return; }

    ctx.fillStyle = '#404040'; ctx.fillRect(0, 0, 800, 600);
    ctx.globalCompositeOperation = 'screen';
    const supported = ctx.globalCompositeOperation === 'screen';
    ctx.globalCompositeOperation = 'source-over';
    info('screen blend: ' + (supported ? 'supported' : 'NOT supported'));

    const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.9));
    if (blob && blob.size > 0) ok('toBlob JPEG works — ' + blob.size + ' bytes');
    else bad('toBlob returned null or empty');
  } catch (error) {
    bad('canvas error: ' + error.message);
  }
}

/* ── 5. Full pipeline with a real image ───────── */
document.getElementById('file').addEventListener('change', async (event) => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  head('Full pipeline');
  info('file: ' + file.name);
  info('type: ' + (file.type || '(empty)') + ', size: ' + (file.size / 1e6).toFixed(2) + ' MB');

  let url = null;
  try {
    url = URL.createObjectURL(file);
    const img = new Image();
    img.src = url;

    try {
      await img.decode();
      ok('decoded');
    } catch (error) {
      bad('img.decode() failed: ' + error.name + ' — ' + error.message);
      info('  trying the onload event instead…');
      await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('onerror')); });
      ok('  onload did fire');
    }

    info('size: ' + img.naturalWidth + ' × ' + img.naturalHeight + ' px');
    if (!img.naturalWidth) { bad('image width is 0 — this is where processing stops'); return; }

    const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * scale);
    const h = Math.round(img.naturalHeight * scale);

    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    ok('photo drawn to canvas — ' + w + ' × ' + h);

    const leak = new Image();
    leak.src = 'leaks/L0.jpg';
    try {
      await leak.decode();
      ok('leak loaded — ' + leak.naturalWidth + ' × ' + leak.naturalHeight);
    } catch (error) {
      bad('leaks/L0.jpg will not load: ' + error.message);
      return;
    }

    const layer = document.createElement('canvas');
    layer.width = w; layer.height = h;
    const lx = layer.getContext('2d');
    lx.fillStyle = '#000'; lx.fillRect(0, 0, w, h);
    lx.drawImage(leak, 0, 0, w, h);
    lx.globalCompositeOperation = 'multiply';
    lx.fillStyle = 'rgb(217,217,217)';
    lx.fillRect(0, 0, w, h);
    lx.globalCompositeOperation = 'source-over';

    const ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'screen';
    ctx.drawImage(layer, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ok('leak blended on');

    const blob = await new Promise((res, rej) => {
      try { canvas.toBlob((b) => (b ? res(b) : rej(new Error('null blob'))), 'image/jpeg', 0.92); }
      catch (e) { rej(e); }
    });
    ok('JPEG encoded — ' + (blob.size / 1e6).toFixed(2) + ' MB');

    const outURL = URL.createObjectURL(blob);
    const out = document.getElementById('out');
    out.onload = () => ok('result displayed — the whole pipeline works');
    out.onerror = () => bad('the finished JPEG will not display');
    out.src = outURL;
    out.style.display = 'block';

  } catch (error) {
    bad('stopped: ' + error.name + ' — ' + error.message);
  } finally {
    if (url) URL.revokeObjectURL(url);
  }
});

/* ── Buttons ─────────────────────────────────────── */
document.getElementById('clearBtn').addEventListener('click', async () => {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) await r.unregister();
    }
    for (const name of await caches.keys()) await caches.delete(name);
    alert('Cleared. Now reopen the main page.');
  } catch (error) {
    alert('Failed: ' + error.message);
  }
});

document.getElementById('copyBtn').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(lines.join('\n')); alert('Log copied.'); }
  catch (e) { alert('Select the log and copy it manually.'); }
});

(async function run() {
  lines = [];
  await checkEnvironment();
  await checkServiceWorker();
  await checkFiles();
  await checkCanvas();
  head('Done');
  info('Now pick an image to test the full pipeline.');
})();
</script>
</body>
</html>
